function parseHash(){let h=(location.hash||"#/home").replace(/^#\/?/,"");let [route,query=""]=h.split("?");route=(route||"home").toLowerCase();const allowed=["home","services","pricing","submit","track","support","owner"];state.route=allowed.includes(route)?route:"home";state.params=Object.fromEntries(new URLSearchParams(query));}
function navItems(){return [["home","Home"],["services","Services"],["pricing","Pricing"],["submit","Submit"],["track","Track"],["support","Support"],["owner","Owner"]]}
function renderNav(){const c=state.config.siteContent||{};$("brandName").textContent=c.brandName||"HumanlyReview";$("footBrand").textContent=c.brandName||"HumanlyReview";$("brandTag").textContent=c.tagline||"Expert-style feedback reports";$("brandMark").innerHTML=c.logoImageUrl?`<img src="${esc(c.logoImageUrl)}" alt="">`:esc(c.logoText||"HR");const links=navItems().map(([r,t])=>`<a data-route="${r}" class="${state.route===r?'active':''}" href="#/${r}">${t}</a>`).join("")+`<a class="btn btn-primary" href="#/submit">Start</a>`;$("navLinks").innerHTML=links;$("drawer").innerHTML=`<button class="tiny drawerClose" id="drawerClose">Close ✕</button>`+navItems().map(([r,t])=>`<a data-route="${r}" class="${state.route===r?'active':''}" href="#/${r}">${t}</a>`).join("");$("drawerClose").onclick=closeDrawer;qa("#drawer a").forEach(a=>a.onclick=closeDrawer)}
function openDrawer(){$("drawer").classList.add("open");$("drawerScrim").classList.add("show")}function closeDrawer(){$("drawer").classList.remove("open");$("drawerScrim").classList.remove("show")}
function render(){renderNav();const v=$("view");if(state.route==="home")v.innerHTML=homePage();if(state.route==="services")v.innerHTML=servicesPage();if(state.route==="pricing")v.innerHTML=pricingPage();if(state.route==="submit")v.innerHTML=submitPage();if(state.route==="track")v.innerHTML=trackPage();if(state.route==="support")v.innerHTML=supportPage();if(state.route==="owner")v.innerHTML=ownerPage();bindPage();window.scrollTo({top:0,behavior:"smooth"})}
function homePage(){const c=state.config.siteContent||DEFAULT_CONFIG.siteContent;return `<section class="hero"><div class="wrap heroGrid"><div><div class="eyebrow">Premium guided review journey</div><h1>${esc(c.heroTitle)}</h1><p class="lead">${esc(c.heroSubtitle)}</p><div class="actions"><a href="#/submit" class="btn btn-primary">${esc(c.ctaText||'Start review')}</a><a href="#/track" class="btn btn-soft">${esc(c.secondaryCtaText||'Track submission')}</a></div><div class="chips"><span class="chip">OTP verified email</span><span class="chip">Secure Paystack checkout</span><span class="chip">Automatic tracking after submit</span></div></div><div class="mock"><div class="mockIn"><div class="mockHead"><div><h3>${esc(c.sampleTitle||'Clear PDF feedback report')}</h3><p class="help">${esc(c.sampleText||'Designed for clarity.')}</p></div><div class="score"><b>92%</b></div></div><div class="bars"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div><div class="insight"><span class="dot"></span><div><strong>No lost users after submission</strong><p class="help">After final submission, users are automatically taken to the tracking page with their details filled in.</p></div></div><div class="insight"><span class="dot"></span><div><strong>Admin-controlled status</strong><p class="help">The status bar only changes from the owner dashboard, so users see your exact decision.</p></div></div></div></div></div></section><section class="page"><div class="wrap"><div class="grid4"><div class="stepMini"><span class="num">1</span><div><strong>Choose plan</strong><p class="help">Simple plan cards.</p></div></div><div class="stepMini"><span class="num">2</span><div><strong>Verify email</strong><p class="help">OTP boxes with paste support.</p></div></div><div class="stepMini"><span class="num">3</span><div><strong>Upload & pay</strong><p class="help">Clear loading on every click.</p></div></div><div class="stepMini"><span class="num">4</span><div><strong>Track instantly</strong><p class="help">No confusion after submit.</p></div></div></div></div></section>`}
function servicesPage(){const c=state.config.siteContent||{};return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>What we can review.</h2><p>Clear feedback reports for many kinds of files. For regulated matters, treat the output as feedback, not professional advice.</p></div><div class="grid3">${(c.reviewTypes||[]).map((x,i)=>`<article class="card"><div class="icon">${i+1}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join("")}</div></div></section><section class="page"><div class="wrap"><div class="grid3">${(c.policyCards||[]).map(x=>`<article class="card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join("")}</div></div></section>`}
function pricingPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Simple pricing.</h2><p>Choose by file size, review depth, and support need. You will see the final Paystack amount before confirming payment.</p></div>${plansHtml(true)}</div></section>`}
function plansHtml(goSubmit){return `<div class="plans">${(state.config.plans||[]).map(p=>`<article class="plan ${p.id===state.selectedPlanId?'selected':''}">${p.popular?'<span class="badge">Most popular</span>':''}<h3>${esc(p.name)}</h3><div class="price">${moneyUsd(p.priceUsd)} <small>${p.priceUsd===null?'Contact support':'service value'}</small></div><p class="help">${esc(p.bestFor||'')}</p><ul class="ticks"><li>${esc(p.depth||'Structured review')}</li><li>Main file: ${p.maxMainMb??'Custom'} MB</li><li>Total upload: ${p.maxTotalMb??'Custom'} MB</li></ul><button class="btn ${p.payOnline?'btn-primary':'btn-soft'}" data-pick-plan="${esc(p.id)}" data-go-submit="${goSubmit?'1':'0'}">Choose ${esc(p.name)}</button></article>`).join("")}</div>`}
function stepDone(n){if(n<=1)return !!state.selectedPlanId;if(n===2)return state.emailVerified;if(n===3)return state.fileValid;if(n===4)return state.paymentVerified;return false}
function submitPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Submit your review.</h2><p>This is a guided process. You can go back before final submission to correct mistakes.</p></div><div class="wizard"><aside class="rail">${["Plan","Email OTP","Upload","Payment","Submit"].map((t,i)=>`<button class="railStep ${state.step===i+1?'active':''} ${stepDone(i+1)?'done':''}" data-go-step="${i+1}"><b>${stepDone(i+1)?'✓':i+1}</b><span>${t}<small class="help" style="display:block">${railText(i+1)}</small></span></button>`).join("")}<div class="summaryRows"><div class="summaryRow"><span>Plan</span><strong>${esc(plan().name)}</strong></div><div class="summaryRow"><span>Email</span><strong>${state.emailVerified?esc(state.verifiedEmail):'Not verified'}</strong></div><div class="summaryRow"><span>File</span><strong>${state.mainFile?esc(state.mainFile.name):'Not selected'}</strong></div><div class="summaryRow"><span>Payment</span><strong>${state.paymentVerified?'Verified':'Not verified'}</strong></div></div></aside><main>${submitStep()}</main></div></div></section>`}
function railText(n){return n===1?'Select the right package':n===2?'Code expires in 10 minutes':n===3?'Main file required':n===4?'Verify Paystack payment':'Auto-track after submit'}
function navStepButtons(){return `<div class="actions" style="margin-top:16px"><button class="btn btn-soft" data-prev-step ${state.step<=1?'disabled':''}>Back</button><button class="btn btn-dark" data-next-step ${state.step>=5?'disabled':''}>Next</button></div>`}
function submitStep(){if(state.step===1)return `<div class="panel"><div class="panelTitle"><span class="num">1</span><div><h2>Choose a plan</h2><p>Select the plan before email verification and payment.</p></div></div>${plansHtml(false)}${navStepButtons()}</div>`;if(state.step===2)return emailStep();if(state.step===3)return uploadStep();if(state.step===4)return paymentStep();return finalStep()}
function emailStep(){return `<div class="panel"><div class="panelTitle"><span class="num">2</span><div><h2>Verify email</h2><p>We send one OTP. If you tap twice, the server blocks duplicate sending for a short time.</p></div></div><div class="field"><label>Email for report delivery</label><input id="email" type="email" value="${esc(state.verifiedEmail||'')}" placeholder="you@example.com" ${state.emailVerified?'disabled':''}></div>${state.emailVerified?`<div class="journeyNote">Verified: <strong>${esc(state.verifiedEmail)}</strong>. Need to use another email? <button class="tiny" id="changeEmail" type="button">Change email</button></div>`:`<button class="btn btn-soft" id="sendOtpBtn" type="button">Send verification code</button><div class="field" style="margin-top:12px"><label>Enter OTP</label><div class="otpGrid">${Array.from({length:6}).map((_,i)=>`<input class="otpDigit" inputmode="numeric" maxlength="1" aria-label="OTP digit ${i+1}">`).join("")}</div><div id="otpTimer" class="help" style="margin-top:8px"></div></div><button class="btn btn-green btn-full" id="verifyOtpBtn" type="button">Verify email</button>`}<div id="emailStatus" class="status"></div>${navStepButtons()}</div>`}
function uploadStep(){const formats=(state.config.acceptedExtensions||[]).map(x=>`<span class="chip">.${esc(x)}</span>`).join("");return `<div class="panel"><div class="panelTitle"><span class="num">3</span><div><h2>Upload file and instruction</h2><p>You can change the file before final submission.</p></div></div><div class="field"><label>Short instruction for reviewer</label><textarea id="brief" maxlength="1200" placeholder="Example: Focus on structure, clarity, factual gaps, presentation, and improvement actions.">${esc(sessionStorage.getItem('hr_brief')||'')}</textarea></div><div class="uploadBox"><label>Main file required</label><div>${formats}</div><input id="mainFile" type="file"><div id="mainFileCard">${state.mainFile?fileCard(state.mainFile,true):''}</div></div><div class="uploadBox" style="margin-top:12px"><label>Supporting files optional</label><input id="supportFiles" type="file" multiple><div id="supportFileCards">${state.supportFiles.map(f=>fileCard(f,false)).join('')}</div></div><div id="fileStatus" class="status"></div>${navStepButtons()}</div>`}
function fileCard(f,main){return `<div class="fileCard"><div><div class="fileName">${esc(f.name)}</div><div class="fileMeta">${(f.size/1024/1024).toFixed(2)} MB</div></div><button class="tiny" type="button" ${main?'id="removeMainFile"':'data-remove-support="'+esc(f.name)+'"'}>Remove</button></div>`}
function paymentStep(){const p=plan();return `<div class="panel"><div class="panelTitle"><span class="num">4</span><div><h2>Secure payment</h2><p>Payment opens only after email and file validation. If a mistake is noticed, go back before final submission.</p></div></div><div class="journeyNote"><strong>${esc(p.name)}:</strong> ${moneyUsd(p.priceUsd)} service value. Paystack will show the final ${esc(state.config.currency||'NGN')} amount before you confirm.</div><button class="btn btn-primary btn-full" id="payBtn" ${(!state.emailVerified||!state.fileValid||state.paymentVerified)?'disabled':''}>${state.paymentVerified?'Payment verified':'Continue to secure checkout'}</button><div id="paymentStatus" class="status ${state.paymentVerified?'show ok':''}">${state.paymentVerified?'Payment verified. You can continue to final submission.':''}</div>${state.paymentReference?`<div class="mono" style="margin-top:10px">Reference: ${esc(state.paymentReference)}</div>`:''}<details class="card" style="margin-top:12px"><summary><strong>Already paid or page refreshed?</strong></summary><p class="help">Enter your Paystack reference to verify it again.</p><div class="row"><input id="recoverRef" placeholder="Paystack reference"><button class="btn btn-soft" id="recoverBtn" type="button">Recover payment</button></div></details>${navStepButtons()}</div>`}
function finalStep(){return `<div class="panel"><div class="panelTitle"><span class="num">5</span><div><h2>Final submission</h2><p>After this, you will automatically move to tracking so you will not feel lost.</p></div></div><div class="journeyNote"><strong>Before clicking submit:</strong> confirm your plan, email, file, and instruction are correct. After submission, use Support if you need correction.</div><button class="btn btn-green btn-full" id="submitBtn" ${(!state.emailVerified||!state.fileValid||!state.paymentVerified)?'disabled':''}>Submit paid review</button><div id="submitStatus" class="status"></div></div>`}
function trackPage(){const email=state.params.email||JSON.parse(sessionStorage.getItem("hr_last_submission")||"{}").email||"";const id=state.params.id||JSON.parse(sessionStorage.getItem("hr_last_submission")||"{}").id||"";return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Track your submission.</h2><p>Your status is controlled by HumanlyReview admin. When admin updates the work, this page shows the exact status, message, and next action.</p></div><div class="panel" style="max-width:760px"><div class="row"><div class="field"><label>Email</label><input id="trackEmail" type="email" value="${esc(email)}" placeholder="you@example.com"></div><div class="field"><label>Submission ID</label><input id="trackId" value="${esc(id)}" placeholder="HR-YYYYMMDD-XXXXXX"></div></div><button class="btn btn-primary" id="trackBtn">Check status</button><div id="trackStatus" class="status"></div><div id="trackResult"></div></div></div></section>`}
function supportPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Support.</h2><p>Use this for payment issues, upload mistakes, correction requests, or anything that makes you feel stuck.</p></div><div class="panel" style="max-width:800px"><div class="row"><div class="field"><label>Email</label><input id="supportEmail" type="email" value="${esc(state.verifiedEmail||'')}" placeholder="you@example.com"></div><div class="field"><label>Category</label><select id="supportCategory"><option>Payment issue</option><option>Upload mistake</option><option>Correction request</option><option>Report delivery</option><option>General support</option></select></div></div><div class="row"><input id="supportSub" placeholder="Submission ID, if available"><input id="supportRef" placeholder="Payment reference, if available"></div><div class="field"><label>Message</label><textarea id="supportMsg" placeholder="Explain what happened and what you need help with."></textarea></div><button class="btn btn-primary" id="supportBtn">Send support message</button><div id="supportStatus" class="status"></div></div></div></section>`}
function ownerPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Owner control center.</h2><p>Control the website, submissions, statuses, payments, support, setup, and troubleshooting without editing code after setup.</p></div>${state.admin.token?adminShell():adminLogin()}</div></section>`}
function adminLogin(){return `<div class="panel" style="max-width:560px"><div class="field"><label>Owner PIN</label><input id="ownerPin" type="password" inputmode="numeric" placeholder="Enter owner PIN"></div><button class="btn btn-primary btn-full" id="ownerLoginBtn">Unlock dashboard</button><div id="ownerStatus" class="status"></div><p class="help">If no owner PIN exists yet, the first 6+ character PIN you enter becomes the owner PIN. Keep it private.</p></div>`}
const ADMIN_TABS=[['overview','Overview'],['work','Workroom'],['payments','Payments'],['support','Support'],['website','Website'],['setup','Setup'],['logs','Logs']];
function adminShell(){return `<div class="adminShell"><aside class="adminSide"><strong>Owner tools</strong><p class="help">Structured sections so you do not get lost.</p><button class="btn btn-soft btn-full" id="adminRefresh">Refresh dashboard</button><button class="btn btn-danger btn-full" id="ownerLogout" style="margin-top:8px">Logout</button><select class="adminMobileSelect" id="adminMobileSelect">${ADMIN_TABS.map(t=>`<option value="${t[0]}" ${state.admin.tab===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select><div class="adminTabs">${ADMIN_TABS.map(t=>`<button data-admin-tab="${t[0]}" class="${state.admin.tab===t[0]?'active':''}">${t[1]}</button>`).join("")}</div></aside><main class="adminMain">${adminTab()}</main></div>`}
function adminTab(){const d=state.admin.data;if(!d)return `<div class="status show info roll">Loading dashboard...</div>`;if(state.admin.tab==='overview')return adminOverview(d);if(state.admin.tab==='work')return adminWork(d);if(state.admin.tab==='payments')return adminPayments(d);if(state.admin.tab==='support')return adminSupport(d);if(state.admin.tab==='website')return adminWebsite(d);if(state.admin.tab==='setup')return adminSetup(d);return adminLogs(d)}
function adminOverview(d){const s=d.stats||{};return `<div class="sectionHead"><h2>Business control center</h2><p>Immediate view of what needs attention.</p></div><div class="statGrid">${[['New',s.newSubmissions],['In review',s.inProgress],['Open support',s.openSupport],['Unsubmitted payments',s.unconsumed]].map(x=>`<div class="stat"><span class="help">${x[0]}</span><strong>${x[1]||0}</strong></div>`).join('')}</div><div class="adminCards"><div class="adminCard"><strong>Quick lookup</strong><p class="help">Find customer by email, reference, file name, or Submission ID.</p><div class="row"><input id="adminLookupQ" placeholder="Search"><button class="btn btn-soft" id="adminLookupBtn">Lookup</button></div><div id="adminLookupResult"></div></div>${(d.logs||[]).slice(0,8).map(l=>`<div class="adminCard"><strong>${esc(l.action)}</strong><p class="help">${esc(l.createdAt)} · ${esc(l.email||'')}</p><p class="help">${esc(l.note||l.after||'')}</p></div>`).join('')}</div>`}
function adminSubTabs(items){return `<div class="subTabs">${items.map(([k,t])=>`<button data-admin-sub="${k}" class="${(state.admin.sub||items[0][0])===k?'active':''}">${t}</button>`).join('')}</div>`}
function adminWork(d){const sub=state.admin.sub||'queue';const items=[['queue','Queue'],['lookup','Lookup'],['status','Status presets']];return `${adminSubTabs(items)}${sub==='lookup'?adminLookupPanel():sub==='status'?adminStatusEditor(d):adminSubmissions(d)}`}
function adminSubmissions(d){return `<div class="sectionHead"><h2>Submission workroom</h2><p>Update user-facing status, report link, notes, files, and customer communication.</p></div><div class="adminCards">${(d.submissions||[]).map(r=>submissionCard(r,d.config)).join('')||'<div class="adminCard">No submissions yet.</div>'}</div>`}
function adminLookupPanel(){return `<div class="adminCard"><strong>Deep lookup</strong><p class="help">Troubleshoot by email, submission ID, reference, file name, or status.</p><div class="row"><input id="adminLookupQ" placeholder="Search anything"><button class="btn btn-primary" id="adminLookupBtn">Search</button></div><div id="adminLookupResult"></div></div>`}
function submissionCard(r,cfg){const statuses=(cfg.statusOptions||[]).map(s=>s.label);return `<div class="adminCard"><div class="adminHead"><div><strong>${esc(r.submissionId)}</strong><p class="help">${esc(r.email)} · ${esc(r.planName)} · ${esc(r.createdAt)}</p></div><span class="pill ${/completed|ready/i.test(r.status)?'ok':/action|cancel|deleted/i.test(r.status)?'bad':'warn'}">${esc(r.status||'Received')}</span></div><p class="help">File: <a href="${esc(r.mainFileUrl)}" target="_blank" rel="noopener">${esc(r.mainFileName||'Open file')}</a> · Payment: ${esc(r.paymentReference||'')}</p><details><summary><strong>Manage this submission</strong></summary><div class="miniGrid" style="margin-top:10px"><select data-sub-status="${esc(r.submissionId)}">${statuses.map(x=>`<option ${String(r.status)===x?'selected':''}>${esc(x)}</option>`).join('')}</select><input data-sub-percent="${esc(r.submissionId)}" type="number" min="0" max="100" value="${esc(r.statusPercent||20)}"><input data-sub-report="${esc(r.submissionId)}" value="${esc(r.reportUrl||'')}" placeholder="Report URL"></div><div class="row" style="margin-top:10px"><textarea data-sub-public="${esc(r.submissionId)}" placeholder="Public status note shown to user">${esc(r.publicNote||'')}</textarea><textarea data-sub-action="${esc(r.submissionId)}" placeholder="Customer action shown to user">${esc(r.customerAction||'')}</textarea></div><textarea data-sub-note="${esc(r.submissionId)}" placeholder="Private admin note" style="margin-top:10px">${esc(r.adminNote||'')}</textarea><div class="adminActions"><button class="btn btn-primary" data-save-sub="${esc(r.submissionId)}">Save status</button><button class="btn btn-green" data-email-report="${esc(r.submissionId)}">Save + email report</button><button class="btn btn-soft" data-reply-user="${esc(r.submissionId)}">Email user</button><button class="btn btn-danger" data-delete-files="${esc(r.submissionId)}">Trash files</button><button class="btn btn-danger" data-delete-row="${esc(r.submissionId)}">Delete row</button></div><div class="hide" data-reply-box="${esc(r.submissionId)}"><input data-reply-subject="${esc(r.submissionId)}" value="HumanlyReview update: ${esc(r.submissionId)}"><textarea data-reply-body="${esc(r.submissionId)}" placeholder="Message to customer"></textarea><button class="btn btn-soft" data-send-reply="${esc(r.submissionId)}" data-to="${esc(r.email)}">Send email</button></div></details></div>`}
function adminStatusEditor(d){return `<div class="sectionHead"><h2>Status presets</h2><p>These status labels and default notes appear in admin dropdowns and customer tracking.</p></div><div class="adminCard"><textarea id="statusJson" class="jsonBox">${esc(JSON.stringify(d.config.statusOptions||[],null,2))}</textarea><button class="btn btn-primary" id="saveStatuses" style="margin-top:12px">Save status presets</button><div id="statusPresetStatus" class="status"></div></div>`}
function adminPayments(d){const plans=(d.config.plans||[]).filter(p=>p.payOnline);return `<div class="sectionHead"><h2>Payments</h2><p>Recover successful payments and manually verify only after checking your Paystack dashboard.</p></div><div class="adminCard"><strong>Manual verification</strong><div class="miniGrid" style="margin-top:10px"><input id="manualEmail" placeholder="Customer email"><input id="manualRef" placeholder="Paystack reference"><select id="manualPlan">${plans.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><input id="manualNote" placeholder="Required admin note" style="margin-top:10px"><button class="btn btn-primary" id="manualVerify" style="margin-top:10px">Mark as paid</button><div id="manualStatus" class="status"></div></div><div class="adminCards">${(d.payments||[]).map(p=>`<div class="adminCard"><div class="adminHead"><strong>${esc(p.reference)}</strong><span class="pill ${String(p.status).toLowerCase()==='success'?'ok':'warn'}">${esc(p.status)}</span></div><p class="help">${esc(p.email)} · ${esc(p.planId)} · ${koboToMoney(p.amountKobo,p.currency)} · Consumed: ${esc(p.consumed)}</p><p class="help">Submission: ${esc(p.submissionId||'none')} · ${esc(p.createdAt)}</p></div>`).join('')}</div>`}
function adminSupport(d){return `<div class="sectionHead"><h2>Support inbox</h2><p>Reply to users and mark issues resolved.</p></div><div class="adminCards">${(d.support||[]).map(s=>`<div class="adminCard"><div class="adminHead"><strong>${esc(s.category)}</strong><span class="pill ${/closed|resolved/i.test(s.status)?'ok':'warn'}">${esc(s.status||'New')}</span></div><p class="help">${esc(s.email)} · ${esc(s.createdAt)} · ${esc(s.submissionId||'no ID')}</p><p>${esc(s.message)}</p><div class="row"><input data-sup-subject="${s.row}" value="HumanlyReview support update"><textarea data-sup-body="${s.row}" placeholder="Reply message"></textarea></div><div class="adminActions"><button class="btn btn-soft" data-send-support-reply="${s.row}" data-to="${esc(s.email)}">Send reply</button><button class="btn btn-green" data-close-support="${s.row}">Mark closed</button></div></div>`).join('')||'<div class="adminCard">No support messages yet.</div>'}</div>`}
function adminWebsite(d){const c=d.config.siteContent||DEFAULT_CONFIG.siteContent;return `<div class="sectionHead"><h2>Website control</h2><p>Edit branding, homepage copy, services, policies, plans, FAQ, and file rules.</p></div>${adminSubTabs([['brand','Branding'],['copy','Homepage'],['plans','Plans'],['faq','FAQ']])}${adminWebsiteSub(d,c)}`}
function adminWebsiteSub(d,c){const sub=state.admin.sub||'brand';if(sub==='copy')return `<div class="adminCard"><div class="field"><label>Hero title</label><input id="siteHeroTitle" value="${esc(c.heroTitle)}"></div><div class="field"><label>Hero subtitle</label><textarea id="siteHeroSubtitle">${esc(c.heroSubtitle)}</textarea></div><div class="row"><input id="siteCta" value="${esc(c.ctaText||'Start review')}"><input id="siteSecondCta" value="${esc(c.secondaryCtaText||'Track submission')}"></div><div class="field"><label>Review types JSON</label><textarea id="siteReviewTypes" class="jsonBox">${esc(JSON.stringify(c.reviewTypes||[],null,2))}</textarea></div><div class="field"><label>Policy cards JSON</label><textarea id="sitePolicyCards" class="jsonBox">${esc(JSON.stringify(c.policyCards||[],null,2))}</textarea></div><button class="btn btn-primary" id="saveWebsiteCopy">Save homepage/services</button><div id="websiteStatus" class="status"></div></div>`;if(sub==='plans')return adminPlans(d);if(sub==='faq')return adminFaq(d);return `<div class="adminCard"><div class="miniGrid"><input id="brandNameInput" value="${esc(c.brandName||'HumanlyReview')}" placeholder="Brand name"><input id="brandTagInput" value="${esc(c.tagline||'Expert-style feedback reports')}" placeholder="Tagline"><input id="logoTextInput" value="${esc(c.logoText||'HR')}" placeholder="Logo text"></div><div class="field" style="margin-top:10px"><label>Logo image URL optional</label><input id="logoUrlInput" value="${esc(c.logoImageUrl||'')}" placeholder="https://..."></div><button class="btn btn-primary" id="saveBranding">Save branding</button><div id="brandingStatus" class="status"></div></div>`}
function adminPlans(d){return `<div class="adminCards">${(d.config.plans||[]).map(p=>`<div class="adminCard" data-plan-edit="${esc(p.id)}"><div class="miniGrid"><input data-plan-field="name" value="${esc(p.name)}"><input data-plan-field="priceUsd" value="${p.priceUsd===null?'':esc(p.priceUsd)}" placeholder="Price USD"><input data-plan-field="id" value="${esc(p.id)}" readonly></div><div class="miniGrid" style="margin-top:10px"><input data-plan-field="maxMainMb" value="${p.maxMainMb??''}" placeholder="Main MB"><input data-plan-field="maxTotalMb" value="${p.maxTotalMb??''}" placeholder="Total MB"><select data-plan-field="payOnline"><option value="true" ${p.payOnline?'selected':''}>Pay online</option><option value="false" ${!p.payOnline?'selected':''}>Support first</option></select></div><input data-plan-field="bestFor" value="${esc(p.bestFor)}" style="margin-top:10px"><input data-plan-field="depth" value="${esc(p.depth)}" style="margin-top:10px"><label class="help"><input type="checkbox" data-plan-field="popular" ${p.popular?'checked':''} style="width:auto;min-height:auto"> Most popular</label></div>`).join('')}</div><div class="adminCard"><div class="miniGrid"><input id="adminCurrency" value="${esc(d.config.currency)}" placeholder="Currency"><input id="adminFx" value="${esc(d.config.fxRate)}" placeholder="FX rate"><input id="adminExt" value="${esc((d.config.acceptedExtensions||[]).join(','))}" placeholder="pdf,docx,png"></div><button class="btn btn-primary" id="savePlans" style="margin-top:12px">Save plans and limits</button><div id="plansStatus" class="status"></div></div>`}
function adminFaq(d){return `<div class="adminCard"><textarea id="faqJson" class="jsonBox">${esc(JSON.stringify(d.config.faqs||[],null,2))}</textarea><button class="btn btn-primary" id="saveFaq" style="margin-top:12px">Save FAQ</button><div id="faqStatus" class="status"></div></div>`}
function adminSetup(d){const s=d.setup||{};return `<div class="sectionHead"><h2>Setup & troubleshooting</h2><p>Manage keys, PIN, storage, email, Telegram, and system health from one place.</p></div>${adminSubTabs([['keys','Keys'],['storage','Storage'],['health','Health']])}${adminSetupSub(d,s)}`}
function adminSetupSub(d,s){const sub=state.admin.sub||'keys';if(sub==='storage')return `<div class="adminCard"><strong>Storage</strong><p class="help">Current Sheet: ${esc(s.sheetIdMasked||'not set')} · Drive folder: ${esc(s.driveFolderIdMasked||'not set')}</p><div class="row"><input id="setupSheetId" placeholder="New Google Sheet ID"><input id="setupDriveId" placeholder="New Drive Folder ID"></div><button class="btn btn-soft" id="createDriveFolder" style="margin-top:10px">Create new upload folder</button><button class="btn btn-primary" id="saveStorage" style="margin-top:10px">Save storage IDs</button><div id="storageStatus" class="status"></div></div>`;if(sub==='health')return `<button class="btn btn-primary" id="runHealth">Run full health check</button><div id="healthResult" class="adminCards"></div>`;return `<div class="adminCard"><strong>Secure keys</strong><p class="help">Leave any field blank to keep the current value. Secret values are stored in Apps Script properties and are not shown back.</p><div class="miniGrid"><input id="setupPublic" placeholder="Paystack public key pk_..."><input id="setupSecret" placeholder="Paystack secret key sk_..."><input id="setupPin" placeholder="New owner PIN"></div><div class="miniGrid" style="margin-top:10px"><input id="setupSupport" placeholder="Support email" value="${esc(s.supportEmail||'')}"><input id="setupTelegramBot" placeholder="Telegram bot token"><input id="setupTelegramChat" placeholder="Telegram chat ID"></div><button class="btn btn-primary" id="saveSetupKeys" style="margin-top:12px">Save setup</button><div id="setupStatus" class="status"></div><div class="adminCards"><div class="adminCard"><strong>Current status</strong><p class="help">Paystack secret: ${esc(s.paystackSecretMode)} · public: ${esc(s.paystackPublicMode)} · Owner PIN: ${s.ownerPinSet?'set':'not set'} · Telegram: ${s.telegramBotPresent&&s.telegramChatPresent?'ready':'optional'}</p></div></div></div>`}
function adminLogs(d){return `<div class="sectionHead"><h2>Activity logs</h2><p>Recent backend and owner actions.</p></div><div class="adminCards">${(d.logs||[]).map(l=>`<div class="adminCard"><strong>${esc(l.action)}</strong><p class="help">${esc(l.createdAt)} · ${esc(l.email||'')} · ${esc(l.submissionId||'')}</p><p class="help">${esc(l.note||l.after||'')}</p></div>`).join('')}</div>`}
function bindPage(){qa("[data-pick-plan]").forEach(b=>b.onclick=()=>{state.selectedPlanId=b.dataset.pickPlan;localStorage.setItem("hr_plan",state.selectedPlanId);resetPayment();if(b.dataset.goSubmit==='1')location.hash="#/submit";else{state.step=2;render()}});qa("[data-go-step]").forEach(b=>b.onclick=()=>{const n=Number(b.dataset.goStep);if(n<=state.step||stepDone(n-1)){state.step=n;render()}});const next=q("[data-next-step]"); if(next)next.onclick=()=>{if(state.step<5){state.step++;render()}};const prev=q("[data-prev-step]"); if(prev)prev.onclick=()=>{if(state.step>1){state.step--;render()}};if(state.route==='submit')bindSubmit();if(state.route==='track')bindTrack();if(state.route==='support')bindSupport();if(state.route==='owner')bindOwner();}
function resetPayment(){state.paymentVerified=false;state.paymentReference="";sessionStorage.removeItem("hr_paid");sessionStorage.removeItem("hr_ref")}
function bindSubmit(){const send=$("sendOtpBtn");if(send)send.onclick=sendOtp;const verify=$("verifyOtpBtn");if(verify)verify.onclick=verifyOtp;const change=$("changeEmail");if(change)change.onclick=()=>{state.emailVerified=false;state.authToken="";state.verifiedEmail="";sessionStorage.removeItem("hr_auth");sessionStorage.removeItem("hr_email");resetPayment();render()};bindOtpInputs();const main=$("mainFile");if(main)main.onchange=()=>{state.mainFile=main.files[0]||null;validateFileState();resetPayment();render()};const sup=$("supportFiles");if(sup)sup.onchange=()=>{state.supportFiles=Array.from(sup.files||[]);validateFileState();resetPayment();render()};const rem=$("removeMainFile");if(rem)rem.onclick=()=>{state.mainFile=null;validateFileState();resetPayment();render()};qa("[data-remove-support]").forEach(b=>b.onclick=()=>{state.supportFiles=state.supportFiles.filter(f=>f.name!==b.dataset.removeSupport);validateFileState();resetPayment();render()});const brief=$("brief");if(brief)brief.oninput=()=>sessionStorage.setItem("hr_brief",brief.value);const pay=$("payBtn");if(pay)pay.onclick=payNow;const rec=$("recoverBtn");if(rec)rec.onclick=()=>verifyPayment($("recoverRef").value,$("recoverBtn"));const sub=$("submitBtn");if(sub)sub.onclick=submitReview}
function bindOtpInputs(){const inputs=qa(".otpDigit");inputs.forEach((inp,i)=>{inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,1);if(inp.value&&inputs[i+1])inputs[i+1].focus()};inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&inputs[i-1])inputs[i-1].focus()};inp.onpaste=e=>{e.preventDefault();const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);inputs.forEach((x,j)=>x.value=v[j]||'');if(inputs[Math.min(v.length,5)])inputs[Math.min(v.length,5)].focus()}})}
async function sendOtp(){const btn=$("sendOtpBtn"),el=$("emailStatus"),email=$("email").value;setBtn(btn,true,"Sending");status(el,"info","Sending verification code...",true);try{const d=await api("sendOtp",{email});state.otpExpires=Date.now()+Number(d.expiresInSeconds||600)*1000;status(el,d.sent?"ok":"info",d.message);startOtpTimer()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function startOtpTimer(){const box=$("otpTimer");if(!box)return;clearInterval(window.hrOtpTimer);window.hrOtpTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((state.otpExpires-Date.now())/1000));box.textContent=left?`Code expires in ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'Code expired. Request a new one.';if(!left)clearInterval(window.hrOtpTimer)},1000)}
async function verifyOtp(){const btn=$("verifyOtpBtn"),el=$("emailStatus");const code=qa(".otpDigit").map(x=>x.value).join('');setBtn(btn,true,"Verifying");status(el,"info","Verifying code...",true);try{const d=await api("verifyOtp",{email:$("email").value,code});state.authToken=d.authToken;state.verifiedEmail=d.email;state.emailVerified=true;sessionStorage.setItem("hr_auth",d.authToken);sessionStorage.setItem("hr_email",d.email);status(el,"ok","Email verified. Continue to upload.");state.step=3;render()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function validateFileState(){state.fileValid=false;if(!state.mainFile)return;const p=plan(),cfg=state.config;const total=state.mainFile.size+state.supportFiles.reduce((s,f)=>s+f.size,0);const ext=state.mainFile.name.split('.').pop().toLowerCase();if(!(cfg.acceptedExtensions||[]).map(x=>String(x).toLowerCase()).includes(ext))return;if(p.maxMainMb!==null&&state.mainFile.size>Number(p.maxMainMb)*1024*1024)return;if(p.maxTotalMb!==null&&total>Number(p.maxTotalMb)*1024*1024)return;if(state.supportFiles.length>Number(cfg.maxSupportFiles||3))return;state.fileValid=true}
async function payNow(){const btn=$("payBtn"),el=$("paymentStatus");setBtn(btn,true,"Opening checkout");status(el,"info","Preparing secure checkout...",true);try{if(!window.PaystackPop)throw new Error("Paystack script is still loading. Wait a moment and try again.");const prep=await api("preparePayment",{email:state.verifiedEmail,authToken:state.authToken,planId:state.selectedPlanId});const pop=new PaystackPop();pop.newTransaction({key:prep.key,email:prep.email,amount:prep.amount,currency:prep.currency,ref:prep.reference,metadata:{custom_fields:[{display_name:"Plan",variable_name:"plan",value:prep.planName}]},onSuccess:tx=>verifyPayment((tx&&tx.reference)||prep.reference,btn),onCancel:()=>{status(el,"info","Checkout was closed. No payment was verified.");setBtn(btn,false)},onError:error=>{status(el,"err",(error&&error.message)||"Paystack checkout failed. Try again.");setBtn(btn,false)}})}catch(e){status(el,"err",e.message);setBtn(btn,false)}}
async function verifyPayment(reference,btn){const el=$("paymentStatus");status(el,"info","Verifying payment securely...",true);try{const d=await api("verifyPayment",{email:state.verifiedEmail,authToken:state.authToken,planId:state.selectedPlanId,reference});state.paymentVerified=true;state.paymentReference=d.reference||reference;sessionStorage.setItem("hr_ref",state.paymentReference);sessionStorage.setItem("hr_paid","1");status(el,"ok","Payment verified. Continue to final submission.");setTimeout(()=>{state.step=5;render()},600)}catch(e){status(el,"err",e.message)}finally{if(btn)setBtn(btn,false)}}
function fileToPayload(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error("Could not read file: "+f.name));r.onload=()=>resolve({name:f.name,type:f.type||"application/octet-stream",size:f.size,base64:String(r.result).split(',')[1]||""});r.readAsDataURL(f)})}
async function submitReview(){const btn=$("submitBtn"),el=$("submitStatus");setBtn(btn,true,"Submitting");status(el,"info","Uploading files and creating your tracking page...",true);try{const main=await fileToPayload(state.mainFile);const support=[];for(const f of state.supportFiles)support.push(await fileToPayload(f));const d=await api("submitReview",{email:state.verifiedEmail,authToken:state.authToken,planId:state.selectedPlanId,paymentReference:state.paymentReference,mainFile:main,supportFiles:support,brief:sessionStorage.getItem("hr_brief")||"",userAgent:navigator.userAgent,sourcePage:location.href});sessionStorage.setItem("hr_last_submission",JSON.stringify({email:d.email,id:d.submissionId}));sessionStorage.removeItem("hr_ref");sessionStorage.removeItem("hr_paid");state.paymentVerified=false;state.paymentReference="";status(el,"ok","Submission received. Opening your tracking page...");location.hash="#/track?email="+encodeURIComponent(d.email)+"&id="+encodeURIComponent(d.submissionId)+"&fresh=1"}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function bindTrack(){const b=$("trackBtn");b.onclick=()=>trackLookup(b);const key=($("trackEmail")?.value||'')+'|'+($("trackId")?.value||'');if((state.params.fresh||state.params.id)&&key&&state.autoTrackedKey!==key){state.autoTrackedKey=key;setTimeout(()=>trackLookup(b),250)}}
async function trackLookup(btn){const el=$("trackStatus");setBtn(btn,true,"Checking");status(el,"info","Checking your latest status...",true);try{const d=await api("statusLookup",{email:$("trackEmail").value,submissionId:$("trackId").value});status(el,"ok","Latest status loaded.");renderTrackResult(d.submission)}catch(e){status(el,"err",e.message);$("trackResult").innerHTML=`<div class="journeyNote" style="margin-top:12px">Mistake? Check the email and ID carefully. If you are still stuck, open Support and include your payment reference.</div>`}finally{setBtn(btn,false)}}
function renderTrackResult(s){const pct=Math.max(0,Math.min(100,Number(s.statusPercent||0)));const steps=[['Received',20],['In Review',45],['Quality Check',70],['Report Ready',92],['Completed',100]];$("trackResult").innerHTML=`<div class="card" style="margin-top:14px"><div class="adminHead"><div><h3>${esc(s.submissionId)}</h3><p class="help">${esc(s.planName||'')} · ${esc(s.mainFileName||'')} · Updated ${esc(s.updatedAt||'')}</p></div><span class="pill ${pct>=90?'ok':pct<=0?'bad':'warn'}">${esc(s.status)}</span></div><div class="progressTrack"><b style="width:${pct}%"></b></div><p><strong>Status message:</strong> ${esc(s.publicNote||'')}</p><p><strong>Your action:</strong> ${esc(s.customerAction||'No action needed.')}</p>${s.reportUrl?`<a class="btn btn-primary" href="${esc(s.reportUrl)}" target="_blank" rel="noopener">Open report</a>`:''}<div class="timeline">${steps.map(([t,p])=>`<div class="timelineStep ${pct>=p?'done':''}"><b>${pct>=p?'✓':'•'}</b><div><strong>${t}</strong><p class="help">${p}% milestone</p></div></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn btn-soft" onclick="location.hash='#/support'">Need help?</button><button class="btn btn-soft" onclick="navigator.clipboard.writeText('${esc(s.submissionId)}')">Copy ID</button></div></div>`}
function bindSupport(){const b=$("supportBtn");b.onclick=async()=>{const el=$("supportStatus");setBtn(b,true,"Sending");status(el,"info","Sending support message...",true);try{await api("chatMessage",{email:$("supportEmail").value,category:$("supportCategory").value,message:$("supportMsg").value,submissionId:$("supportSub").value,paymentReference:$("supportRef").value,page:location.href});status(el,"ok","Support message sent. We will use your details to help you.");$("supportMsg").value=""}catch(e){status(el,"err",e.message)}finally{setBtn(b,false)}}}
function bindOwner(){const login=$("ownerLoginBtn");if(login)login.onclick=ownerLogin;const logout=$("ownerLogout");if(logout)logout.onclick=()=>{state.admin.token="";sessionStorage.removeItem("hr_owner_token");state.admin.data=null;render()};const ref=$("adminRefresh");if(ref)ref.onclick=()=>loadAdmin(ref);const mob=$("adminMobileSelect");if(mob)mob.onchange=()=>{state.admin.tab=mob.value;state.admin.sub="";localStorage.setItem("hr_admin_tab",state.admin.tab);render()};qa("[data-admin-tab]").forEach(b=>b.onclick=()=>{state.admin.tab=b.dataset.adminTab;state.admin.sub="";localStorage.setItem("hr_admin_tab",state.admin.tab);localStorage.removeItem("hr_admin_sub");render()});qa("[data-admin-sub]").forEach(b=>b.onclick=()=>{state.admin.sub=b.dataset.adminSub;localStorage.setItem("hr_admin_sub",state.admin.sub);render()});if(state.admin.token&&!state.admin.data)loadAdmin();bindAdminActions()}
async function ownerLogin(){const btn=$("ownerLoginBtn"),el=$("ownerStatus");setBtn(btn,true,"Unlocking");status(el,"info","Checking owner PIN...",true);try{const d=await api("ownerLogin",{pin:$("ownerPin").value});state.admin.token=d.ownerToken;sessionStorage.setItem("hr_owner_token",d.ownerToken);status(el,"ok",d.setupMode?"Owner PIN created and dashboard unlocked.":"Dashboard unlocked.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function ownerApi(action,payload={}){return api(action,{ownerToken:state.admin.token,...payload})} async function loadAdmin(btn){if(btn)setBtn(btn,true,"Refreshing");try{state.admin.data=await ownerApi("adminGetDashboard");render()}catch(e){state.admin.token="";sessionStorage.removeItem("hr_owner_token");alert(e.message);render()}finally{if(btn)setBtn(btn,false)}}
function bindAdminActions(){const lookup=$("adminLookupBtn");if(lookup)lookup.onclick=()=>adminLookup(lookup);const manual=$("manualVerify");if(manual)manual.onclick=()=>adminManualVerify(manual);const saveStatuses=$("saveStatuses");if(saveStatuses)saveStatuses.onclick=()=>saveStatusesAction(saveStatuses);const saveBranding=$("saveBranding");if(saveBranding)saveBranding.onclick=()=>saveBrandingAction(saveBranding);const saveWebsite=$("saveWebsiteCopy");if(saveWebsite)saveWebsite.onclick=()=>saveWebsiteCopy(saveWebsite);const savePlans=$("savePlans");if(savePlans)savePlans.onclick=()=>savePlansAction(savePlans);const saveFaq=$("saveFaq");if(saveFaq)saveFaq.onclick=()=>saveFaqAction(saveFaq);const setup=$("saveSetupKeys");if(setup)setup.onclick=()=>saveSetupKeys(setup);const storage=$("saveStorage");if(storage)storage.onclick=()=>saveStorage(storage);const create=$("createDriveFolder");if(create)create.onclick=()=>createDriveFolder(create);const health=$("runHealth");if(health)health.onclick=()=>runHealth(health);qa("[data-save-sub]").forEach(b=>b.onclick=()=>adminSaveSubmission(b.dataset.saveSub,false,b));qa("[data-email-report]").forEach(b=>b.onclick=()=>adminSaveSubmission(b.dataset.emailReport,true,b));qa("[data-reply-user]").forEach(b=>b.onclick=()=>{q(`[data-reply-box="${CSS.escape(b.dataset.replyUser)}"]`).classList.toggle("hide")});qa("[data-send-reply]").forEach(b=>b.onclick=()=>adminSendReply(b.dataset.sendReply,b.dataset.to,b));qa("[data-delete-files]").forEach(b=>b.onclick=()=>adminDeleteFiles(b.dataset.deleteFiles,b));qa("[data-delete-row]").forEach(b=>b.onclick=()=>adminDeleteRow(b.dataset.deleteRow,b));qa("[data-send-support-reply]").forEach(b=>b.onclick=()=>adminSendSupportReply(b.dataset.sendSupportReply,b.dataset.to,b));qa("[data-close-support]").forEach(b=>b.onclick=()=>adminCloseSupport(b.dataset.closeSupport,b))}
async function adminLookup(btn){const box=$("adminLookupResult");setBtn(btn,true,"Searching");box.innerHTML='<div class="status show info roll">Searching...</div>';try{const d=await ownerApi("adminLookup",{query:$("adminLookupQ").value});box.innerHTML=`<div class="adminCards"><div class="adminCard"><strong>Results</strong><p class="help">Submissions: ${d.submissions.length}; Payments: ${d.payments.length}; Support: ${d.support.length}</p></div>${d.submissions.map(r=>submissionCard(r,state.admin.data.config)).join('')}</div>`;bindAdminActions()}catch(e){box.innerHTML=`<div class="status show err">${esc(e.message)}</div>`}finally{setBtn(btn,false)}}
async function adminSaveSubmission(id,emailReport,btn){setBtn(btn,true,"Saving");try{await ownerApi("adminUpdateSubmission",{submissionId:id,status:q(`[data-sub-status="${CSS.escape(id)}"]`).value,statusPercent:q(`[data-sub-percent="${CSS.escape(id)}"]`).value,publicNote:q(`[data-sub-public="${CSS.escape(id)}"]`).value,customerAction:q(`[data-sub-action="${CSS.escape(id)}"]`).value,reportUrl:q(`[data-sub-report="${CSS.escape(id)}"]`).value,note:q(`[data-sub-note="${CSS.escape(id)}"]`).value,emailReport:String(emailReport)});await loadAdmin()}catch(e){alert(e.message)}finally{setBtn(btn,false)}}
async function adminSendReply(id,to,btn){setBtn(btn,true,"Sending");try{await ownerApi("adminSendEmail",{to,subject:q(`[data-reply-subject="${CSS.escape(id)}"]`).value,message:q(`[data-reply-body="${CSS.escape(id)}"]`).value,submissionId:id});alert("Email sent")}catch(e){alert(e.message)}finally{setBtn(btn,false)}}
async function adminDeleteFiles(id,btn){if(!confirm("Move all Drive files for this submission to Trash?"))return;setBtn(btn,true,"Trashing");try{const d=await ownerApi("adminDeleteSubmissionFiles",{submissionId:id});alert("Files trashed: "+(d.result.trashed||[]).length+". Failed: "+(d.result.failed||[]).length);await loadAdmin()}catch(e){alert(e.message)}finally{setBtn(btn,false)}}
async function adminDeleteRow(id,btn){const confirmText=prompt("This removes the submission row from Google Sheets. Type DELETE ROW to continue.");if(confirmText!=="DELETE ROW")return;setBtn(btn,true,"Deleting");try{await ownerApi("adminRemoveSubmissionRecord",{submissionId:id,confirm:confirmText});await loadAdmin()}catch(e){alert(e.message)}finally{setBtn(btn,false)}}
async function adminManualVerify(btn){const el=$("manualStatus");setBtn(btn,true,"Saving");status(el,"info","Saving manual verification...",true);try{await ownerApi("adminManualVerify",{email:$("manualEmail").value,reference:$("manualRef").value,planId:$("manualPlan").value,note:$("manualNote").value});status(el,"ok","Manual payment verification saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function adminSendSupportReply(row,to,btn){setBtn(btn,true,"Sending");try{await ownerApi("adminSendEmail",{to,subject:q(`[data-sup-subject="${CSS.escape(row)}"]`).value,message:q(`[data-sup-body="${CSS.escape(row)}"]`).value});alert("Reply sent")}catch(e){alert(e.message)}finally{setBtn(btn,false)}}
async function adminCloseSupport(row,btn){setBtn(btn,true,"Closing");try{await ownerApi("adminUpdateSupportStatus",{row,status:"Closed"});await loadAdmin()}catch(e){alert(e.message)}finally{setBtn(btn,false)}}
async function saveStatusesAction(btn){const el=$("statusPresetStatus");setBtn(btn,true,"Saving");status(el,"info","Saving status presets...",true);try{await ownerApi("adminUpdateSettings",{settings:{statusOptions:JSON.parse($("statusJson").value)}});status(el,"ok","Status presets saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function saveBrandingAction(btn){const el=$("brandingStatus");setBtn(btn,true,"Saving");status(el,"info","Saving branding...",true);try{const c={...(state.admin.data.config.siteContent||{}),brandName:$("brandNameInput").value,tagline:$("brandTagInput").value,logoText:$("logoTextInput").value,logoImageUrl:$("logoUrlInput").value};await ownerApi("adminUpdateSettings",{settings:{siteContent:c}});status(el,"ok","Branding saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function saveWebsiteCopy(btn){const el=$("websiteStatus");setBtn(btn,true,"Saving");status(el,"info","Saving website copy...",true);try{const c={...(state.admin.data.config.siteContent||{}),heroTitle:$("siteHeroTitle").value,heroSubtitle:$("siteHeroSubtitle").value,ctaText:$("siteCta").value,secondaryCtaText:$("siteSecondCta").value,reviewTypes:JSON.parse($("siteReviewTypes").value),policyCards:JSON.parse($("sitePolicyCards").value)};await ownerApi("adminUpdateSettings",{settings:{siteContent:c}});status(el,"ok","Website copy saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function savePlansAction(btn){const el=$("plansStatus");setBtn(btn,true,"Saving");status(el,"info","Saving plans...",true);try{const plans=qa('[data-plan-edit]').map(card=>{const id=card.dataset.planEdit;const obj={id};qa('[data-plan-field]',card).forEach(f=>{const k=f.dataset.planField;if(k==='id')return;if(k==='popular')obj[k]=f.checked;else if(k==='payOnline')obj[k]=f.value==='true';else if(['priceUsd','maxMainMb','maxTotalMb'].includes(k))obj[k]=f.value===''?null:Number(f.value);else obj[k]=f.value});return obj});await ownerApi("adminUpdateSettings",{settings:{plans,currency:$("adminCurrency").value,fxRate:Number($("adminFx").value),acceptedExtensions:$("adminExt").value.split(',').map(x=>x.trim().replace(/^\./,'')).filter(Boolean)}});status(el,"ok","Plans and limits saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function saveFaqAction(btn){const el=$("faqStatus");setBtn(btn,true,"Saving");status(el,"info","Saving FAQ...",true);try{await ownerApi("adminUpdateSettings",{settings:{faqs:JSON.parse($("faqJson").value)}});status(el,"ok","FAQ saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function saveSetupKeys(btn){const el=$("setupStatus");setBtn(btn,true,"Saving");status(el,"info","Saving setup securely...",true);try{await ownerApi("adminUpdateSetup",{setup:{PAYSTACK_PUBLIC_KEY:$("setupPublic").value,PAYSTACK_SECRET_KEY:$("setupSecret").value,OWNER_PIN:$("setupPin").value,SUPPORT_EMAIL:$("setupSupport").value,TELEGRAM_BOT_TOKEN:$("setupTelegramBot").value,TELEGRAM_CHAT_ID:$("setupTelegramChat").value}});status(el,"ok","Setup saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function saveStorage(btn){const el=$("storageStatus");setBtn(btn,true,"Saving");status(el,"info","Saving storage IDs...",true);try{await ownerApi("adminUpdateSetup",{setup:{SHEET_ID:$("setupSheetId").value,DRIVE_FOLDER_ID:$("setupDriveId").value}});status(el,"ok","Storage settings saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function createDriveFolder(btn){const el=$("storageStatus");setBtn(btn,true,"Creating");status(el,"info","Creating Drive folder...",true);try{const d=await ownerApi("adminCreateDriveFolder",{name:"HumanlyReview Uploads"});status(el,"ok","Folder created: "+d.id);await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function runHealth(btn){const box=$("healthResult");setBtn(btn,true,"Checking");box.innerHTML='<div class="adminCard"><div class="status show info roll">Running full system check...</div></div>';try{const data=await ownerApi("adminHealth");box.innerHTML=(data.checks||[]).map(c=>`<div class="adminCard"><div class="adminHead"><strong>${esc(c.name)}</strong><span class="pill ${c.level==='ok'?'ok':c.level==='warn'?'warn':'bad'}">${esc(c.level)}</span></div><p class="help">${esc(c.detail)}</p></div>`).join('')}catch(e){box.innerHTML=`<div class="status show err">${esc(e.message)}</div>`}finally{setBtn(btn,false)}}
async function boot(){parseHash();$("menuBtn").onclick=openDrawer;$("drawerScrim").onclick=closeDrawer;try{const data=await api("getPublicConfig",{});state.config={...DEFAULT_CONFIG,...data.config,siteContent:{...DEFAULT_CONFIG.siteContent,...(data.config.siteContent||{})}}}catch(e){console.warn(e)}render()}
window.addEventListener("hashchange",()=>{parseHash();render()});boot();
</script>
