function bindGlobal(){window.addEventListener("hashchange",()=>{routeFromHash();render()});$("menuBtn").onclick=()=>$("navlinks").classList.toggle("open");$("quickSupport").onclick=()=>{location.hash="#/support"};document.addEventListener("click",e=>{const a=e.target.closest("a[data-route]");if(a)$("navlinks").classList.remove("open")});}
function render(){qa("[data-route]").forEach(a=>a.classList.toggle("active",a.dataset.route===state.route));const v=$("view");if(state.route==="home")v.innerHTML=homePage();if(state.route==="services")v.innerHTML=servicesPage();if(state.route==="pricing")v.innerHTML=pricingPage();if(state.route==="submit")v.innerHTML=submitPage();if(state.route==="track")v.innerHTML=trackPage();if(state.route==="support")v.innerHTML=supportPage();if(state.route==="owner")v.innerHTML=ownerPage();bindPage();}
function homePage(){const c=state.config.siteContent||DEFAULT_CONFIG.siteContent;return `<section class="hero"><div class="wrap heroGrid"><div><div class="eyebrow">File upload → OTP verification → secure checkout → PDF report</div><h1>${esc(c.heroTitle)}</h1><p class="lead">${esc(c.heroSubtitle)}</p><div class="actions"><a class="btn btn-primary" href="#/submit">${esc(c.ctaText||"Start a review")}</a><a class="btn btn-soft" href="#/track">${esc(c.secondaryCtaText||"Track submission")}</a></div><div class="chips"><span class="chip">Feedback only</span><span class="chip">Modern OTP boxes</span><span class="chip">Paystack checkout</span><span class="chip">Owner dashboard</span></div></div><div class="mock"><div class="mockIn"><div class="mockHead"><div><h3>${esc(c.sampleTitle)}</h3><p class="help">${esc(c.sampleText)}</p></div><div class="score"><b>78</b></div></div><div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="insight"><span class="dot"></span><div><strong>Issue identification</strong><p class="help">The report shows what needs attention and what the user should improve next.</p></div></div><div class="insight"><span class="dot"></span><div><strong>Action checklist</strong><p class="help">Clear, practical next steps without completing the work for the user.</p></div></div></div></div></div></section><section class="page"><div class="wrap"><div class="grid4"><div class="stepMini"><div class="num">1</div><div><strong>Choose plan</strong><p class="help">Simple file limits and review depth.</p></div></div><div class="stepMini"><div class="num">2</div><div><strong>Verify email</strong><p class="help">OTP expires after 10 minutes.</p></div></div><div class="stepMini"><div class="num">3</div><div><strong>Upload file</strong><p class="help">One main file plus optional support files.</p></div></div><div class="stepMini"><div class="num">4</div><div><strong>Pay & submit</strong><p class="help">Payment is verified before upload is saved.</p></div></div></div></div></section>`+servicesBlock()+pricingBlock(false);}
function servicesBlock(){const c=state.config.siteContent||DEFAULT_CONFIG.siteContent;return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>What HumanlyReview can review.</h2><p>Useful for many file types. For regulated matters, treat the output as feedback and not professional advice.</p></div><div class="grid3">${(c.reviewTypes||[]).map((x,i)=>`<article class="card"><div class="icon">${String.fromCharCode(65+i)}</div><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join("")}</div></div></section>`;}
function servicesPage(){const c=state.config.siteContent||DEFAULT_CONFIG.siteContent;return servicesBlock()+`<section class="page"><div class="wrap"><div class="sectionHead"><h2>Clear boundaries build trust.</h2><p>The website tells customers exactly what the service does and what it does not do.</p></div><div class="grid3">${(c.policyCards||[]).map(x=>`<article class="card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join("")}</div></div></section>`;}
function pricingBlock(showHead=true){return `<section class="page"><div class="wrap">${showHead?`<div class="sectionHead"><h2>Pricing that is easy to understand.</h2><p>Prices show the USD service value. Checkout displays the supported payment currency before confirmation.</p></div>`:""}<div class="plans">${planCards()}</div></div></section>`;}
function pricingPage(){return pricingBlock(true)+faqBlock();}
function planCards(){return (state.config.plans||[]).map(p=>`<article class="plan ${p.id===state.selectedPlanId?"selected":""}">${p.popular?`<div class="badge">Most popular</div>`:""}<div><h3>${esc(p.name)}</h3><div class="price">${money(p.priceUsd)} ${p.priceUsd!==null?"<small>/ review</small>":""}</div><p class="help">${esc(p.bestFor)}</p></div><ul class="ticks"><li>${p.payOnline?`Main file up to ${esc(p.maxMainMb)} MB`:"Custom file handling"}</li><li>${p.payOnline?`Total upload up to ${esc(p.maxTotalMb)} MB`:"Support confirmation first"}</li><li>${esc(p.depth)}</li></ul><button class="btn ${p.id===state.selectedPlanId?"btn-green":"btn-soft"}" data-pick-plan="${esc(p.id)}">${p.id===state.selectedPlanId?"Selected":"Choose plan"}</button></article>`).join("");}
function faqBlock(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Questions before you submit.</h2><p>Simple support guidance for upload, payment, privacy, and delivery.</p></div><div class="grid3">${(state.config.faqs||[]).map(f=>`<details class="card"><summary><strong>${esc(f[0])}</strong></summary><p style="margin-top:10px">${esc(f[1])}</p></details>`).join("")}</div></div></section>`;}
function submitPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Submit a review file.</h2><p>Move step by step. The next button only opens when the current step is ready.</p></div><div class="wizard"><aside class="rail">${rail()}${summary()}</aside><div>${stepPanel()}</div></div></div></section>`;}
function rail(){const steps=[[1,"Plan"],[2,"Email"],[3,"File"],[4,"Pay"],[5,"Submit"]];return steps.map(([n,t])=>`<div class="railStep ${state.step===n?"active":""} ${stepDone(n)?"done":""}" data-go-step="${n}"><b>${stepDone(n)?"✓":n}</b><span>${t}</span></div>`).join("");}
function stepDone(n){if(n===1)return !!selectedPlan(); if(n===2)return state.emailVerified; if(n===3)return state.fileValid; if(n===4)return state.paymentVerified; if(n===5)return false;}
function summary(){const p=selectedPlan();return `<div class="summaryRows"><div class="summaryRow"><span>Plan</span><strong>${esc(p.name)}</strong></div><div class="summaryRow"><span>Email</span><strong>${state.emailVerified?esc(state.verifiedEmail):"Not verified"}</strong></div><div class="summaryRow"><span>File</span><strong>${state.mainFile?esc(state.mainFile.name):"Not selected"}</strong></div><div class="summaryRow"><span>Payment</span><strong>${state.paymentVerified?"Verified":"Not verified"}</strong></div></div><div id="globalStatus" class="status show info">${canSubmit()?"Everything is ready. Submit now.":"Complete each step to continue."}</div>`;}
function stepPanel(){if(state.step===1)return stepPlan(); if(state.step===2)return stepEmail(); if(state.step===3)return stepFile(); if(state.step===4)return stepPay(); return stepSubmit();}
function stepPlan(){return `<div class="panel"><div class="panelTitle"><div class="num">1</div><div><h2>Choose the review plan</h2><p>Select the plan that matches your file size and review depth.</p></div></div><div class="plans">${planCards()}</div><div class="navBtns"><span></span><button class="btn btn-primary" data-next-step>Continue to email verification</button></div></div>`;}
function stepEmail(){return `<div class="panel"><div class="panelTitle"><div class="num">2</div><div><h2>Verify report email</h2><p>We send one OTP code. The code expires in 10 minutes.</p></div></div><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" value="${esc(state.verifiedEmail||state.email)}" placeholder="you@example.com"></div><button class="btn btn-soft" id="sendOtpBtn" type="button">Send verification code</button><div id="otpTimer" class="help" style="margin-top:8px"></div><div class="otpWrap" id="otpWrap">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" data-otp="${i}" aria-label="OTP digit ${i+1}">`).join("")}</div><button class="btn btn-green btn-full" id="verifyOtpBtn" type="button">Verify email</button><div id="emailStatus" class="status"></div><div class="navBtns"><button class="btn btn-ghost" data-prev-step>Back</button><button class="btn btn-primary" data-next-step ${state.emailVerified?"":"disabled"}>Continue to upload</button></div></div>`;}
function stepFile(){const exts=state.config.acceptedExtensions||DEFAULT_CONFIG.acceptedExtensions;return `<div class="panel"><div class="panelTitle"><div class="num">3</div><div><h2>Upload review file</h2><p>Upload one main file. Add support files only if they help the review.</p></div></div><div class="uploadBox ${state.mainFile?"active":""}"><label>Main file required</label><div class="formatRow">${exts.map(x=>`<span class="format">.${esc(x)}</span>`).join("")}</div><input id="mainFile" type="file" accept="${exts.map(x=>'.'+x).join(',')}">${fileCard(state.mainFile,"main")}</div><div class="uploadBox" style="margin-top:12px"><label>Supporting files optional</label><p class="help">Maximum ${(state.config.maxSupportFiles||3)} supporting files.</p><input id="supportFiles" type="file" multiple accept="${exts.map(x=>'.'+x).join(',')}"><div>${state.supportFiles.map((f,i)=>fileCard(f,"support",i)).join("")}</div></div><div id="fileStatus" class="status ${state.fileValid?'show ok':''}">${state.fileValid?'File validation passed.':''}</div><div class="navBtns"><button class="btn btn-ghost" data-prev-step>Back</button><button class="btn btn-primary" data-next-step ${state.fileValid?"":"disabled"}>Continue to payment</button></div></div>`;}
function fileCard(f,type,i){if(!f)return"";return `<div class="fileCard"><div><div class="fileName">${esc(f.name)}</div><div class="fileMeta">${mb(f.size)} MB · ${esc(f.type||"file")}</div></div><button class="tiny" type="button" data-remove-file="${type}" data-index="${i??0}">Remove</button></div>`;}
function stepPay(){const p=selectedPlan();return `<div class="panel"><div class="panelTitle"><div class="num">4</div><div><h2>Pay securely</h2><p>Payment opens on this page and is verified before final submission.</p></div></div><div class="payBox"><p><strong>${esc(p.name)}:</strong> ${money(p.priceUsd)} service value. Paystack will display the final ${(state.config.currency||'NGN')} amount before you approve.</p><button class="btn btn-primary btn-full" id="payBtn" ${canPay()?"":"disabled"}>Continue to secure checkout</button><div id="paymentStatus" class="status ${state.paymentVerified?'show ok':''}">${state.paymentVerified?'Payment verified. You can submit now.':''}</div>${state.paymentReference?`<div style="margin-top:10px"><div class="help">Payment reference</div><div class="mono">${esc(state.paymentReference)}</div></div>`:""}<details class="card" style="margin-top:12px"><summary><strong>Already paid but not verified?</strong></summary><p class="help">Enter the Paystack reference and recover using the same verified email and selected plan.</p><div class="row" style="margin-top:10px"><input id="recoverRef" placeholder="Paystack reference"><button class="btn btn-soft" id="recoverBtn" type="button">Recover payment</button></div></details></div><div class="navBtns"><button class="btn btn-ghost" data-prev-step>Back</button><button class="btn btn-primary" data-next-step ${state.paymentVerified?"":"disabled"}>Continue to final submit</button></div></div>`;}
function stepSubmit(){return `<div class="panel"><div class="panelTitle"><div class="num">5</div><div><h2>Final submission</h2><p>Submit once. Keep the page open while the file uploads.</p></div></div><div class="field"><label>Short instruction for reviewer</label><textarea id="brief" maxlength="1200" placeholder="Example: Focus on structure, clarity, presentation, gaps, and improvement actions."></textarea></div><button class="btn btn-green btn-full" id="submitBtn" ${canSubmit()?"":"disabled"}>Submit paid review</button><div id="submitStatus" class="status"></div><div id="successBox"></div><div class="navBtns"><button class="btn btn-ghost" data-prev-step>Back</button></div></div>`;}
function canPay(){return state.emailVerified&&state.fileValid&&selectedPlan().payOnline&&!state.paymentVerified;} function canSubmit(){return state.emailVerified&&state.fileValid&&state.paymentVerified&&state.paymentReference;} function updateSubmitButtons(){const ns=q("[data-next-step]"); if(ns){ if(state.step===2)ns.disabled=!state.emailVerified; if(state.step===3)ns.disabled=!state.fileValid; if(state.step===4)ns.disabled=!state.paymentVerified;} const pb=$("payBtn"); if(pb)pb.disabled=!canPay(); const sb=$("submitBtn"); if(sb)sb.disabled=!canSubmit();}
function trackPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Track a submission.</h2><p>Use the exact email and Submission ID you received after upload.</p></div><div class="panel"><div class="row"><input id="trackEmail" type="email" placeholder="Email used for submission"><input id="trackId" placeholder="Submission ID, e.g. HR-20260522-ABC123"></div><button class="btn btn-primary" id="trackBtn" style="margin-top:12px">Check status</button><div id="trackStatus" class="status"></div><div id="trackResult"></div></div></div></section>`;}
function supportPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Support that is easy to use.</h2><p>Tell us the issue. For payment issues, include your Paystack reference.</p></div><div class="panel"><div class="row"><input id="supportEmail" type="email" placeholder="Your email"><select id="supportCategory"><option>Payment issue</option><option>Upload issue</option><option>Report delivery</option><option>General question</option></select></div><div class="row"><input id="supportSub" placeholder="Submission ID optional"><input id="supportRef" placeholder="Payment reference optional"></div><textarea id="supportMsg" placeholder="Explain what happened"></textarea><button class="btn btn-primary" id="supportBtn">Send support message</button><div id="supportStatus" class="status"></div></div></div></section>`;}
function ownerPage(){return `<section class="page"><div class="wrap"><div class="sectionHead"><h2>Owner dashboard.</h2><p>Control submissions, payments, support, plans, FAQ, public website copy, and troubleshooting without editing code.</p></div>${state.admin.token?adminShell():adminLogin()}</div></section>`;}
function adminLogin(){return `<div class="panel" style="max-width:520px"><div class="field"><label>Owner PIN</label><input id="ownerPin" type="password" inputmode="numeric" placeholder="Enter owner PIN"></div><button class="btn btn-primary btn-full" id="ownerLoginBtn">Unlock dashboard</button><div id="ownerStatus" class="status"></div><p class="help">Keep this page private. Secret keys should remain in Apps Script Properties, not inside public website code.</p></div>`;}
function adminShell(){const tabs=[['overview','Overview'],['submissions','Submissions'],['payments','Payments'],['support','Support'],['website','Website'],['plans','Plans'],['faq','FAQ'],['health','Troubleshoot']];return `<div class="adminShell"><aside class="adminSide"><strong>Owner tools</strong><p class="help">Session stays active for a few hours.</p><button class="btn btn-soft btn-full" id="adminRefresh">Refresh</button><button class="btn btn-danger btn-full" id="ownerLogout" style="margin-top:8px">Logout</button><div class="adminTabs">${tabs.map(t=>`<button data-admin-tab="${t[0]}" class="${state.admin.tab===t[0]?'active':''}">${t[1]}</button>`).join("")}</div></aside><main class="adminMain">${adminTab()}</main></div>`;}
function adminTab(){const d=state.admin.data;if(!d)return `<div class="status show info roll">Loading dashboard...</div>`;if(state.admin.tab==="overview")return adminOverview(d);if(state.admin.tab==="submissions")return adminSubmissions(d);if(state.admin.tab==="payments")return adminPayments(d);if(state.admin.tab==="support")return adminSupport(d);if(state.admin.tab==="website")return adminWebsite(d);if(state.admin.tab==="plans")return adminPlans(d);if(state.admin.tab==="faq")return adminFaq(d);return adminHealth(d);}
function adminOverview(d){const s=d.stats||{};return `<div class="sectionHead"><h2>Business control center</h2><p>Quick view of what needs attention.</p></div><div class="statGrid">${[['New submissions',s.newSubmissions],['In review',s.inProgress],['Open support',s.openSupport],['Paid payments',s.paidPayments]].map(x=>`<div class="stat"><span class="help">${x[0]}</span><strong>${x[1]||0}</strong></div>`).join("")}</div><div class="adminCards"><div class="adminCard"><strong>Quick lookup</strong><p class="help">Find customer by email, reference, file name, or Submission ID.</p><div class="row"><input id="adminLookupQ" placeholder="Search"><button class="btn btn-soft" id="adminLookupBtn">Lookup</button></div><div id="adminLookupResult"></div></div>${(d.logs||[]).slice(0,8).map(l=>`<div class="adminCard"><strong>${esc(l.action)}</strong><p class="help">${esc(l.createdAt)} · ${esc(l.email||'')}</p><p class="help">${esc(l.note||l.after||'')}</p></div>`).join("")}</div>`;}
function adminSubmissions(d){return `<div class="sectionHead"><h2>Submissions</h2><p>Update report status, attach report URL, email customer, delete files, or remove records.</p></div><div class="adminCards">${(d.submissions||[]).map(r=>submissionCard(r)).join("")||'<div class="adminCard">No submissions yet.</div>'}</div>`;}
function submissionCard(r){return `<article class="adminCard" data-sub-card="${esc(r.submissionId)}"><div class="adminHead"><div><strong>${esc(r.submissionId)}</strong><p class="help">${esc(r.email)} · ${esc(r.planName)} · ${esc(r.createdAt)}</p></div><span class="pill ${/sent|completed|ready/i.test(r.status)?'ok':/new|progress|review/i.test(r.status)?'warn':''}">${esc(r.status||'New')}</span></div><p class="help"><b>File:</b> ${r.mainFileUrl?`<a href="${esc(r.mainFileUrl)}" target="_blank" rel="noopener">${esc(r.mainFileName)}</a>`:esc(r.mainFileName||'')}</p><p class="help"><b>Instruction:</b> ${esc(r.reviewInstruction||'')}</p><div class="miniGrid"><input data-sub-status="${esc(r.submissionId)}" value="${esc(r.status||'New')}"><input data-sub-report="${esc(r.submissionId)}" value="${esc(r.reportUrl||'')}" placeholder="Report URL"><input data-sub-note="${esc(r.submissionId)}" value="${esc(r.adminNote||'')}" placeholder="Admin note"></div><div class="adminActions"><button class="btn btn-green" data-save-sub="${esc(r.submissionId)}">Save</button><button class="btn btn-primary" data-email-report="${esc(r.submissionId)}">Save & email report</button><button class="btn btn-soft" data-reply-user="${esc(r.email)}" data-reply-id="${esc(r.submissionId)}">Email user</button><button class="btn btn-danger" data-delete-files="${esc(r.submissionId)}">Delete files</button><button class="btn btn-danger" data-delete-row="${esc(r.submissionId)}">Remove row</button></div><div class="replyBox hide" data-reply-box="${esc(r.submissionId)}"><div class="row" style="margin-top:10px"><input data-reply-subject="${esc(r.submissionId)}" value="Update on your HumanlyReview submission ${esc(r.submissionId)}"><textarea data-reply-body="${esc(r.submissionId)}" placeholder="Message to customer"></textarea></div><button class="btn btn-soft" data-send-reply="${esc(r.submissionId)}" data-to="${esc(r.email)}">Send email</button></div></article>`;}
function adminPayments(d){const plans=(d.config.plans||[]).filter(p=>p.payOnline);return `<div class="sectionHead"><h2>Payments</h2><p>Verify issues, recover references, and manually mark payment only when you are sure.</p></div><div class="adminCard"><strong>Manual verification</strong><p class="help">Use only after checking Paystack dashboard. Admin note is required.</p><div class="miniGrid"><input id="manualEmail" placeholder="Customer email"><input id="manualRef" placeholder="Paystack reference"><select id="manualPlan">${plans.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></div><input id="manualNote" placeholder="Required admin note" style="margin-top:10px"><button class="btn btn-primary" id="manualVerify" style="margin-top:10px">Mark as paid</button><div id="manualStatus" class="status"></div></div><div class="adminCards">${(d.payments||[]).map(p=>`<div class="adminCard"><div class="adminHead"><strong>${esc(p.reference)}</strong><span class="pill ${String(p.status).toLowerCase()==='success'?'ok':'warn'}">${esc(p.status)}</span></div><p class="help">${esc(p.email)} · ${esc(p.planId)} · ${esc(p.currency)} ${Number(p.amountKobo||0)/100} · Consumed: ${esc(p.consumed)}</p><p class="help">Submission: ${esc(p.submissionId||'none')} · ${esc(p.createdAt)}</p></div>`).join("")}</div>`;}
function adminSupport(d){return `<div class="sectionHead"><h2>Support inbox</h2><p>Reply to users and mark issues as resolved.</p></div><div class="adminCards">${(d.support||[]).map(s=>`<div class="adminCard"><div class="adminHead"><strong>${esc(s.category)}</strong><span class="pill ${/closed|resolved/i.test(s.status)?'ok':'warn'}">${esc(s.status||'New')}</span></div><p class="help">${esc(s.email)} · ${esc(s.createdAt)} · ${esc(s.submissionId||'no ID')}</p><p>${esc(s.message)}</p><div class="row"><input data-sup-subject="${s.row}" value="HumanlyReview support update"><textarea data-sup-body="${s.row}" placeholder="Reply message"></textarea></div><div class="adminActions"><button class="btn btn-soft" data-send-support-reply="${s.row}" data-to="${esc(s.email)}">Send reply</button><button class="btn btn-green" data-close-support="${s.row}">Mark closed</button></div></div>`).join("")||'<div class="adminCard">No support messages yet.</div>'}</div>`;}
function adminWebsite(d){const c=d.config.siteContent||DEFAULT_CONFIG.siteContent;return `<div class="sectionHead"><h2>Website content</h2><p>Edit public text here. No code editing needed.</p></div><div class="adminCard"><div class="field"><label>Hero title</label><input id="siteHeroTitle" value="${esc(c.heroTitle)}"></div><div class="field"><label>Hero subtitle</label><textarea id="siteHeroSubtitle">${esc(c.heroSubtitle)}</textarea></div><div class="row"><input id="siteCta" value="${esc(c.ctaText||'Start a review')}"><input id="siteSecondCta" value="${esc(c.secondaryCtaText||'Track submission')}"></div><div class="field"><label>Review types JSON</label><textarea id="siteReviewTypes" class="jsonBox">${esc(JSON.stringify(c.reviewTypes||[],null,2))}</textarea></div><div class="field"><label>Policy cards JSON</label><textarea id="sitePolicyCards" class="jsonBox">${esc(JSON.stringify(c.policyCards||[],null,2))}</textarea></div><button class="btn btn-primary" id="saveWebsite">Save website content</button><div id="websiteStatus" class="status"></div></div>`;}
function adminPlans(d){return `<div class="sectionHead"><h2>Plans and limits</h2><p>Control plan names, prices, file limits, and plan descriptions.</p></div><div class="adminCards">${(d.config.plans||[]).map(p=>`<div class="adminCard" data-plan-edit="${esc(p.id)}"><div class="miniGrid"><input data-plan-field="name" value="${esc(p.name)}"><input data-plan-field="priceUsd" value="${p.priceUsd===null?'':esc(p.priceUsd)}" placeholder="Price USD"><input data-plan-field="id" value="${esc(p.id)}" readonly></div><div class="miniGrid" style="margin-top:10px"><input data-plan-field="maxMainMb" value="${p.maxMainMb??''}" placeholder="Main MB"><input data-plan-field="maxTotalMb" value="${p.maxTotalMb??''}" placeholder="Total MB"><select data-plan-field="payOnline"><option value="true" ${p.payOnline?'selected':''}>Pay online</option><option value="false" ${!p.payOnline?'selected':''}>Support first</option></select></div><input data-plan-field="bestFor" value="${esc(p.bestFor)}" style="margin-top:10px"><input data-plan-field="depth" value="${esc(p.depth)}" style="margin-top:10px"><label class="help"><input type="checkbox" data-plan-field="popular" ${p.popular?'checked':''} style="width:auto;min-height:auto"> Most popular</label></div>`).join("")}</div><div class="adminCard"><div class="miniGrid"><input id="adminCurrency" value="${esc(d.config.currency)}" placeholder="Currency"><input id="adminFx" value="${esc(d.config.fxRate)}" placeholder="FX rate"><input id="adminExt" value="${esc((d.config.acceptedExtensions||[]).join(','))}" placeholder="pdf,docx,png"></div><button class="btn btn-primary" id="savePlans" style="margin-top:12px">Save plans and limits</button><div id="plansStatus" class="status"></div></div>`;}
function adminFaq(d){return `<div class="sectionHead"><h2>FAQ editor</h2><p>Edit as JSON array. Example: [["Question","Answer"]]</p></div><div class="adminCard"><textarea id="faqJson" class="jsonBox">${esc(JSON.stringify(d.config.faqs||[],null,2))}</textarea><button class="btn btn-primary" id="saveFaq" style="margin-top:12px">Save FAQ</button><div id="faqStatus" class="status"></div></div>`;}
function adminHealth(d){return `<div class="sectionHead"><h2>Troubleshoot</h2><p>Run this after every deployment or whenever payment/upload/email fails.</p></div><button class="btn btn-primary" id="runHealth">Run health check</button><div id="healthResult" class="adminCards"></div>`;}
function bindPage(){qa("[data-pick-plan]").forEach(b=>b.onclick=()=>{state.selectedPlanId=b.dataset.pickPlan;localStorage.setItem("hr_plan",state.selectedPlanId);resetPayment();state.step=Math.max(1,state.step);render()});qa("[data-go-step]").forEach(b=>b.onclick=()=>{const n=Number(b.dataset.goStep); if(n<=state.step||stepDone(n-1)){state.step=n;render()}});const next=q("[data-next-step]"); if(next)next.onclick=()=>{if(state.step<5){state.step++;render()}};const prev=q("[data-prev-step]"); if(prev)prev.onclick=()=>{if(state.step>1){state.step--;render()}};if(state.route==="submit")bindSubmit();if(state.route==="track")bindTrack();if(state.route==="support")bindSupport();if(state.route==="owner")bindOwner();}
function bindSubmit(){const email=$("email"); if(email)email.oninput=()=>{state.email=email.value.trim()};const send=$("sendOtpBtn"); if(send)send.onclick=sendOtp;const verify=$("verifyOtpBtn"); if(verify)verify.onclick=verifyOtp;qa("[data-otp]").forEach(inp=>{inp.oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);const next=q(`[data-otp="${Number(e.target.dataset.otp)+1}"]`); if(e.target.value&&next)next.focus()};inp.onkeydown=e=>{if(e.key==='Backspace'&&!e.target.value){const prev=q(`[data-otp="${Number(e.target.dataset.otp)-1}"]`);if(prev)prev.focus()}};inp.onpaste=e=>{e.preventDefault();const digits=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6).split('');qa('[data-otp]').forEach((x,i)=>x.value=digits[i]||'')}});const mf=$("mainFile"); if(mf)mf.onchange=e=>{state.mainFile=e.target.files[0]||null;validateFiles();render()};const sf=$("supportFiles"); if(sf)sf.onchange=e=>{state.supportFiles=Array.from(e.target.files||[]);validateFiles();render()};qa("[data-remove-file]").forEach(b=>b.onclick=()=>{if(b.dataset.removeFile==='main')state.mainFile=null;else state.supportFiles.splice(Number(b.dataset.index),1);validateFiles();render()});const pay=$("payBtn"); if(pay)pay.onclick=startPayment;const rec=$("recoverBtn"); if(rec)rec.onclick=()=>verifyPayment($("recoverRef").value.trim());const sub=$("submitBtn"); if(sub)sub.onclick=submitReview;}
function resetPayment(){state.paymentReference="";state.paymentVerified=false;sessionStorage.removeItem("hr_ref");sessionStorage.removeItem("hr_paid");}
function validateFiles(){const p=selectedPlan(), exts=(state.config.acceptedExtensions||[]).map(x=>String(x).toLowerCase());let ok=false,msg="";try{if(!state.mainFile)throw new Error("Choose a main file.");const ext=state.mainFile.name.split('.').pop().toLowerCase();if(!exts.includes(ext))throw new Error("Unsupported main file type.");if(state.mainFile.size>Number(p.maxMainMb)*1024*1024)throw new Error(`Main file is above ${p.maxMainMb} MB.`);if(state.supportFiles.length>Number(state.config.maxSupportFiles||3))throw new Error("Too many supporting files.");const total=state.mainFile.size+state.supportFiles.reduce((a,f)=>a+f.size,0);if(total>Number(p.maxTotalMb)*1024*1024)throw new Error(`Total upload is above ${p.maxTotalMb} MB.`);ok=true;msg="File validation passed."}catch(e){msg=e.message}state.fileValid=ok;if(!ok)resetPayment();const fs=$("fileStatus");if(fs)status(fs,ok?"ok":"err",msg);}
async function sendOtp(){const btn=$("sendOtpBtn"), el=$("emailStatus");setBtn(btn,true,"Sending code");status(el,"info","Sending verification code...",true);try{const email=($("email").value||"").trim();const data=await api("sendOtp",{email});state.email=email;state.otpExpires=Date.now()+Number(data.expiresInSeconds||600)*1000;status(el,data.sent===false?"info":"ok",data.message||"Code sent.");startOtpTimer();}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function startOtpTimer(){const t=$("otpTimer");if(!t)return;const tick=()=>{const left=Math.max(0,Math.ceil((state.otpExpires-Date.now())/1000));t.textContent=left?`Code expires in ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:"Code expired. Request a new code.";if(left)setTimeout(tick,1000)};tick();}
async function verifyOtp(){const btn=$("verifyOtpBtn"), el=$("emailStatus");const code=qa('[data-otp]').map(i=>i.value).join('');setBtn(btn,true,"Verifying");status(el,"info","Checking OTP...",true);try{const email=($("email").value||state.email).trim();const data=await api("verifyOtp",{email,code});state.authToken=data.authToken;state.verifiedEmail=email;state.emailVerified=true;sessionStorage.setItem("hr_auth",data.authToken);sessionStorage.setItem("hr_email",email);status(el,"ok","Email verified. Continue to upload.");setTimeout(()=>{state.step=3;render()},700)}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function loadPaystack(){if(window.PaystackPop&&typeof window.PaystackPop==="function")return Promise.resolve();return new Promise((resolve,reject)=>{const s=$("paystackInlineScript");let done=false;const ok=()=>{if(!done&&window.PaystackPop){done=true;resolve()}};const fail=()=>{if(!done){done=true;reject(new Error("Paystack checkout script could not load. Check internet/browser."))}};if(s){s.addEventListener("load",ok,{once:true});s.addEventListener("error",fail,{once:true})}const timer=setInterval(ok,250);setTimeout(()=>{clearInterval(timer);if(!done)fail()},15000)})}
async function startPayment(){const btn=$("payBtn"), el=$("paymentStatus");setBtn(btn,true,"Preparing checkout");status(el,"info","Preparing secure checkout...",true);try{await loadPaystack();const data=await api("preparePayment",{email:state.verifiedEmail,authToken:state.authToken,planId:state.selectedPlanId,sourcePage:location.href});state.paymentReference=data.reference;sessionStorage.setItem("hr_ref",data.reference);status(el,"info","Paystack is opening. Complete payment to continue.",true);const ps=new PaystackPop();ps.newTransaction({key:data.publicKey,email:state.verifiedEmail,amount:Number(data.amount),currency:data.currency,reference:data.reference,onLoad:function(){status(el,"info","Checkout loaded. Complete payment securely.")},onSuccess:function(tx){verifyPayment((tx&& (tx.reference||tx.trxref))||data.reference)},onCancel:function(){status(el,"err","Checkout was closed before completion.");setBtn(btn,false)},onError:function(error){status(el,"err",(error&&error.message)||"Paystack could not open checkout.");setBtn(btn,false)}})}catch(e){status(el,"err",e.message);setBtn(btn,false)}}
async function verifyPayment(ref){const el=$("paymentStatus"), btn=$("payBtn");if(!ref){status(el,"err","Enter payment reference first.");return}status(el,"info","Verifying payment securely...",true);try{const data=await api("verifyPayment",{email:state.verifiedEmail,authToken:state.authToken,planId:state.selectedPlanId,reference:ref});state.paymentReference=data.reference||ref;state.paymentVerified=true;sessionStorage.setItem("hr_ref",state.paymentReference);sessionStorage.setItem("hr_paid","1");status(el,"ok","Payment verified. Continue to final submission.");setTimeout(()=>{state.step=5;render()},800)}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function fileToPayload(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error("Could not read file: "+f.name));r.onload=()=>resolve({name:f.name,type:f.type||"application/octet-stream",size:f.size,base64:String(r.result).split(',')[1]||""});r.readAsDataURL(f)})}
async function submitReview(){const btn=$("submitBtn"), el=$("submitStatus");setBtn(btn,true,"Uploading");status(el,"info","Uploading files and saving submission...",true);try{const main=await fileToPayload(state.mainFile);const support=[];for(const f of state.supportFiles)support.push(await fileToPayload(f));const data=await api("submitReview",{email:state.verifiedEmail,authToken:state.authToken,planId:state.selectedPlanId,paymentReference:state.paymentReference,mainFile:main,supportFiles:support,brief:($("brief")?.value||""),userAgent:navigator.userAgent,sourcePage:location.href});status(el,"ok","Submission received. Save your ID.");$("successBox").innerHTML=`<div class="card" style="margin-top:14px;background:rgba(6,118,71,.06)"><h3>Submission received</h3><p class="help">Save this ID. It has also been sent to your email.</p><div class="mono">${esc(data.submissionId)}</div><button class="btn btn-soft" type="button" onclick="navigator.clipboard.writeText('${esc(data.submissionId)}')" style="margin-top:10px">Copy ID</button></div>`;sessionStorage.removeItem("hr_ref");sessionStorage.removeItem("hr_paid");state.paymentVerified=false;state.paymentReference=""}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
function bindTrack(){const b=$("trackBtn");b.onclick=async()=>{const el=$("trackStatus");setBtn(b,true,"Checking");status(el,"info","Checking status...",true);try{const data=await api("statusLookup",{email:$("trackEmail").value,submissionId:$("trackId").value});status(el,"ok","Submission found.");$("trackResult").innerHTML=`<div class="card" style="margin-top:12px"><h3>${esc(data.submission.submissionId)}</h3><p>Status: <strong>${esc(data.submission.status)}</strong></p>${data.submission.reportUrl?`<a class="btn btn-primary" href="${esc(data.submission.reportUrl)}" target="_blank" rel="noopener">Open report</a>`:''}</div>`}catch(e){status(el,"err",e.message)}finally{setBtn(b,false)}}}
function bindSupport(){const b=$("supportBtn");b.onclick=async()=>{const el=$("supportStatus");setBtn(b,true,"Sending");status(el,"info","Sending support message...",true);try{await api("chatMessage",{email:$("supportEmail").value,category:$("supportCategory").value,message:$("supportMsg").value,submissionId:$("supportSub").value,paymentReference:$("supportRef").value,page:location.href});status(el,"ok","Support message sent.");$("supportMsg").value=""}catch(e){status(el,"err",e.message)}finally{setBtn(b,false)}}}
function bindOwner(){const login=$("ownerLoginBtn");if(login)login.onclick=ownerLogin;const logout=$("ownerLogout");if(logout)logout.onclick=()=>{state.admin.token="";sessionStorage.removeItem("hr_owner_token");state.admin.data=null;render()};const ref=$("adminRefresh");if(ref)ref.onclick=loadAdmin;qa("[data-admin-tab]").forEach(b=>b.onclick=()=>{state.admin.tab=b.dataset.adminTab;render()});if(state.admin.token&&!state.admin.data)loadAdmin();bindAdminActions();}
async function ownerLogin(){const btn=$("ownerLoginBtn"), el=$("ownerStatus");setBtn(btn,true,"Unlocking");status(el,"info","Checking owner PIN...",true);try{const data=await api("ownerLogin",{pin:$("ownerPin").value});state.admin.token=data.ownerToken;sessionStorage.setItem("hr_owner_token",data.ownerToken);status(el,"ok","Dashboard unlocked.");await loadAdmin()}catch(e){status(el,"err",e.message)}finally{setBtn(btn,false)}}
async function ownerApi(action,payload={}){return api(action,{ownerToken:state.admin.token,...payload})} async function loadAdmin(){try{state.admin.data=await ownerApi("adminGetDashboard");render()}catch(e){state.admin.token="";sessionStorage.removeItem("hr_owner_token");alert(e.message);render()}}
function bindAdminActions(){const lookup=$("adminLookupBtn");if(lookup)lookup.onclick=adminLookup;const manual=$("manualVerify");if(manual)manual.onclick=adminManualVerify;const saveWebsite=$("saveWebsite");if(saveWebsite)saveWebsite.onclick=saveWebsiteContent;const savePlans=$("savePlans");if(savePlans)savePlans.onclick=savePlansAction;const saveFaq=$("saveFaq");if(saveFaq)saveFaq.onclick=saveFaqAction;const health=$("runHealth");if(health)health.onclick=runHealth;qa("[data-save-sub]").forEach(b=>b.onclick=()=>adminSaveSubmission(b.dataset.saveSub,false));qa("[data-email-report]").forEach(b=>b.onclick=()=>adminSaveSubmission(b.dataset.emailReport,true));qa("[data-reply-user]").forEach(b=>b.onclick=()=>{q(`[data-reply-box="${CSS.escape(b.dataset.replyId)}"]`).classList.toggle("hide")});qa("[data-send-reply]").forEach(b=>b.onclick=()=>adminSendReply(b.dataset.sendReply,b.dataset.to));qa("[data-delete-files]").forEach(b=>b.onclick=()=>adminDeleteFiles(b.dataset.deleteFiles));qa("[data-delete-row]").forEach(b=>b.onclick=()=>adminDeleteRow(b.dataset.deleteRow));qa("[data-send-support-reply]").forEach(b=>b.onclick=()=>adminSendSupportReply(b.dataset.sendSupportReply,b.dataset.to));qa("[data-close-support]").forEach(b=>b.onclick=()=>adminCloseSupport(b.dataset.closeSupport));}
async function adminLookup(){const box=$("adminLookupResult");box.innerHTML='<div class="status show info roll">Searching...</div>';try{const d=await ownerApi("adminLookup",{query:$("adminLookupQ").value});box.innerHTML=`<div class="adminCards"><div class="adminCard"><strong>Results</strong><p class="help">Submissions: ${d.submissions.length}; Payments: ${d.payments.length}; Support: ${d.support.length}</p></div>${d.submissions.map(submissionCard).join('')}</div>`;bindAdminActions()}catch(e){box.innerHTML=`<div class="status show err">${esc(e.message)}</div>`}}
async function adminSaveSubmission(id,emailReport){const statusV=q(`[data-sub-status="${CSS.escape(id)}"]`).value;const report=q(`[data-sub-report="${CSS.escape(id)}"]`).value;const note=q(`[data-sub-note="${CSS.escape(id)}"]`).value;await ownerApi("adminUpdateSubmission",{submissionId:id,status:statusV,reportUrl:report,note,emailReport:String(emailReport)});await loadAdmin();}
async function adminSendReply(id,to){const subject=q(`[data-reply-subject="${CSS.escape(id)}"]`).value;const message=q(`[data-reply-body="${CSS.escape(id)}"]`).value;await ownerApi("adminSendEmail",{to,subject,message,submissionId:id});alert("Email sent");}
async function adminDeleteFiles(id){if(!confirm("Move all Drive files for this submission to Trash?"))return;const d=await ownerApi("adminDeleteSubmissionFiles",{submissionId:id});alert("Files trashed: "+(d.result.trashed||[]).length+". Failed: "+(d.result.failed||[]).length);await loadAdmin();}
async function adminDeleteRow(id){const confirmText=prompt("This removes the submission row from Google Sheets. Type DELETE ROW to continue.");if(confirmText!=="DELETE ROW")return;await ownerApi("adminRemoveSubmissionRecord",{submissionId:id,confirm:confirmText});await loadAdmin();}
async function adminManualVerify(){const el=$("manualStatus");status(el,"info","Saving manual verification...",true);try{await ownerApi("adminManualVerify",{email:$("manualEmail").value,reference:$("manualRef").value,planId:$("manualPlan").value,note:$("manualNote").value});status(el,"ok","Manual payment verification saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}}
async function adminSendSupportReply(row,to){const subject=q(`[data-sup-subject="${CSS.escape(row)}"]`).value;const message=q(`[data-sup-body="${CSS.escape(row)}"]`).value;await ownerApi("adminSendEmail",{to,subject,message});alert("Reply sent");}
async function adminCloseSupport(row){await ownerApi("adminUpdateSupportStatus",{row,status:"Closed"});await loadAdmin();}
async function saveWebsiteContent(){const el=$("websiteStatus");status(el,"info","Saving website content...",true);try{const c={...(state.admin.data.config.siteContent||{}),heroTitle:$("siteHeroTitle").value,heroSubtitle:$("siteHeroSubtitle").value,ctaText:$("siteCta").value,secondaryCtaText:$("siteSecondCta").value,reviewTypes:JSON.parse($("siteReviewTypes").value),policyCards:JSON.parse($("sitePolicyCards").value)};await ownerApi("adminUpdateSettings",{settings:{siteContent:c}});status(el,"ok","Website content saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}}
async function savePlansAction(){const el=$("plansStatus");status(el,"info","Saving plans...",true);try{const plans=qa('[data-plan-edit]').map(card=>{const id=card.dataset.planEdit;const obj={id};qa('[data-plan-field]',card).forEach(f=>{const k=f.dataset.planField;if(k==='id')return;if(k==='popular')obj[k]=f.checked;else if(k==='payOnline')obj[k]=f.value==='true';else if(['priceUsd','maxMainMb','maxTotalMb'].includes(k))obj[k]=f.value===''?null:Number(f.value);else obj[k]=f.value});return obj});await ownerApi("adminUpdateSettings",{settings:{plans,currency:$("adminCurrency").value,fxRate:Number($("adminFx").value),acceptedExtensions:$("adminExt").value.split(',').map(x=>x.trim().replace(/^\./,'')).filter(Boolean)}});status(el,"ok","Plans and limits saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}}
async function saveFaqAction(){const el=$("faqStatus");status(el,"info","Saving FAQ...",true);try{const faqs=JSON.parse($("faqJson").value);await ownerApi("adminUpdateSettings",{settings:{faqs}});status(el,"ok","FAQ saved.");await loadAdmin()}catch(e){status(el,"err",e.message)}}
async function runHealth(){const box=$("healthResult");box.innerHTML='<div class="adminCard"><div class="status show info roll">Running full system check...</div></div>';try{const data=await ownerApi("adminHealth");box.innerHTML=(data.checks||[]).map(c=>`<div class="adminCard"><div class="adminHead"><strong>${esc(c.name)}</strong><span class="pill ${c.level==='ok'?'ok':c.level==='warn'?'warn':'bad'}">${esc(c.level)}</span></div><p class="help">${esc(c.detail)}</p></div>`).join('')}catch(e){box.innerHTML=`<div class="status show err">${esc(e.message)}</div>`}}
boot();
</script>
</body>
</html>
